<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="235" fill="#0A2540"/>

  <!-- Copilot-inspired inner circle -->
  <circle cx="256" cy="256" r="182" fill="#00D4FF"/>

  <!-- Stylized "C" for Copilot -->
  <text x="256" y="305" font-family="Arial Black, sans-serif" font-size="295" font-weight="900" fill="#0A2540" text-anchor="middle" dominant-baseline="middle">C</text>

  <!-- Bar chart for usage tracking (bottom right) -->
  <!-- Bars representing monthly KPIs -->
  <rect x="320" y="340" width="38" height="75" rx="4" fill="#0A2540"/>
  <rect x="365" y="305" width="38" height="110" rx="4" fill="#0A2540"/>
  <rect x="410" y="275" width="38" height="140" rx="4" fill="#0A2540"/>

  <!-- Subtle grid lines for dashboard feel -->
  <line x1="320" y1="390" x2="460" y2="390" stroke="#0A2540" stroke-width="6" stroke-opacity="0.3"/>
  <line x1="320" y1="355" x2="460" y2="355" stroke="#0A2540" stroke-width="6" stroke-opacity="0.3"/>
</svg>
