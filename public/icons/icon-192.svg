  <!-- Bar chart for usage tracking (bottom right) -->
  <!-- Bars representing monthly KPIs -->
  <rect x="118" y="128" width="14" height="28" rx="2" fill="#0A2540"/>
  <rect x="136" y="115" width="14" height="41" rx="2" fill="#0A2540"/>
  <rect x="154" y="102" width="14" height="54" rx="2" fill="#0A2540"/>

